<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Game Localization Tool</title>
  <script src="/theme-boot.js"></script>
  <style>
    :root {
      --boot-bg: #f4f3fb;
      --boot-fg: #1d1b3a;
      --boot-primary: #4f46b8;
      --boot-gradient: linear-gradient(160deg,
          #f8f7fd 0%,
          #eeedf8 55%,
          #faf9ff 100%);
      --boot-glow: radial-gradient(ellipse 80% 50% at 50% -20%,
          rgba(79, 70, 184, 0.16),
          transparent);
      --boot-muted: color-mix(in srgb, var(--boot-fg) 55%, transparent);
      --boot-icon-bg: #4f46b8;
      --boot-icon-fg: #ffffff;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background-color: var(--boot-bg);
      background-image: var(--boot-gradient);
      background-attachment: fixed;
      color: var(--boot-fg);
      font-family:
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        sans-serif;
    }

    #root {
      min-height: 100%;
    }

    .app-boot {
      box-sizing: border-box;
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: 1.5rem;
      overflow: hidden;
      background-color: var(--boot-bg);
      background-image: var(--boot-gradient);
      animation: app-boot-fade-in 420ms ease-out both;
    }

    .app-boot--exit {
      animation: app-boot-fade-out 240ms ease-in forwards;
      pointer-events: none;
    }

    .app-boot--exit .app-boot__content {
      animation: app-boot-content-out 240ms ease-in forwards;
    }

    .app-boot::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--boot-glow);
      pointer-events: none;
    }

    .app-boot__content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: min(100%, 22rem);
      animation: app-boot-content-in 520ms cubic-bezier(0.22, 1, 0.36, 1) 80ms both;
    }

    .app-boot__icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 3.5rem;
      height: 3.5rem;
      border-radius: 1rem;
      background: linear-gradient(145deg,
          color-mix(in srgb, var(--boot-icon-bg) 86%, white),
          var(--boot-icon-bg));
      color: var(--boot-icon-fg);
      box-shadow: 0 4px 16px color-mix(in srgb, var(--boot-icon-bg) 35%, transparent);
      animation: app-boot-icon-in 560ms cubic-bezier(0.22, 1, 0.36, 1) 120ms both;
    }

    .app-boot__icon svg {
      width: 1.75rem;
      height: 1.75rem;
      color: currentColor;
    }

    .app-boot__title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-align: center;
    }

    .app-boot__subtitle {
      margin: 0;
      font-size: 0.875rem;
      color: var(--boot-muted);
      text-align: center;
    }

    .app-boot__progress {
      width: 100%;
      height: 0.375rem;
      overflow: hidden;
      border-radius: 999px;
      background: color-mix(in srgb, var(--boot-fg) 8%, transparent);
    }

    .app-boot__progress-bar {
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg,
          color-mix(in srgb, var(--boot-primary) 80%, white),
          var(--boot-primary));
      animation: app-boot-progress 1.4s ease-in-out infinite;
    }

    @keyframes app-boot-fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes app-boot-fade-out {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
      }
    }

    @keyframes app-boot-content-in {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes app-boot-content-out {
      from {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

      to {
        opacity: 0;
        transform: translateY(8px) scale(0.985);
      }
    }

    @keyframes app-boot-icon-in {
      from {
        opacity: 0;
        transform: scale(0.88);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes app-boot-progress {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(320%);
      }
    }
  </style>
</head>

<body>
  <div id="app-boot-splash" class="app-boot" role="status" aria-live="polite" aria-label="Loading">
    <div class="app-boot__content">
      <div class="app-boot__icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m5 8 6 6" />
          <path d="m4 14 6-6 2-3" />
          <path d="M2 5h12" />
          <path d="M7 2h1" />
          <path d="m22 22-5-10-5 10" />
          <path d="M14 18h6" />
        </svg>
      </div>
      <p class="app-boot__title">Multi-Game Localization Tool</p>
      <div class="app-boot__progress" aria-hidden="true">
        <div class="app-boot__progress-bar"></div>
      </div>
    </div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
