<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CIV7 Localization Tool</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f4f7f9;
        color: #1e293b;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }

      #root {
        min-height: 100%;
      }

      .app-boot {
        box-sizing: border-box;
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        background:
          radial-gradient(ellipse 80% 50% at 50% -20%, rgba(14, 116, 144, 0.12), transparent),
          #f4f7f9;
      }

      .app-boot__spinner {
        width: 2.25rem;
        height: 2.25rem;
        border: 3px solid rgba(14, 116, 144, 0.18);
        border-top-color: #0e7490;
        border-radius: 50%;
        animation: app-boot-spin 0.75s linear infinite;
      }

      .app-boot__title {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .app-boot__subtitle {
        margin: 0;
        font-size: 0.875rem;
        color: #64748b;
      }

      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="app-boot" role="status" aria-live="polite" aria-label="Loading">
        <div class="app-boot__spinner" aria-hidden="true"></div>
        <p class="app-boot__title">CIV7 Localization Tool</p>
        <p class="app-boot__subtitle">Đang khởi động…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
