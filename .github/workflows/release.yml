# Build Windows NSIS installer và đăng lên GitHub Releases khi push tag v*
# Ref: https://v2.tauri.app/distribute/pipelines/github/

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-windows:
    # Cần write để tauri-action tạo GitHub Release + upload asset.
    # Nếu thiếu: "Resource not accessible by integration".
    # Đồng thời Settings → Actions → Workflow permissions = Read and write.
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compose release notes
        id: notes
        shell: pwsh
        run: |
          $prev = git describe --tags --abbrev=0 --match "v*" HEAD^ 2>$null
          if ($LASTEXITCODE -ne 0) { $prev = $null }
          $log = if ($prev) {
            git log "$prev..HEAD" --pretty=format:'- %s'
          } else {
            git log -20 --pretty=format:'- %s'
          }
          if (-not $log) { $log = "- Phát hành Multi-Game Localization Tool." }
          $notes = @(
            '## Multi-Game Localization Tool v__VERSION__',
            '',
            'Installer Windows x64 (NSIS) kèm engine dịch.',
            '',
            '**Cập nhật trong app:** mở app, xác nhận dialog, chỉ cài khi không có job đang chạy.',
            'User đang dùng bản chưa có updater (v1.1.0) phải tải file .exe một lần.',
            '',
            '### Thay đổi',
            $log
          ) -join "`n"
          $output = "body<<NOTES_EOF`n$notes`nNOTES_EOF`n"
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, $output)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Python sidecar
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: ./scripts/build_python.ps1

      - name: Remove stale release _internal
        shell: pwsh
        run: |
          $releaseInternal = "src-tauri/target/release/_internal"
          if (Test-Path $releaseInternal) {
            cmd /c "rmdir `"$releaseInternal`""
            if (Test-Path $releaseInternal) {
              Remove-Item -LiteralPath $releaseInternal -Force -Recurse -ErrorAction SilentlyContinue
            }
          }

      - name: Build Tauri app & publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Multi-Game Localization Tool v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.release.conf.json
          updaterJsonPreferNsis: true
